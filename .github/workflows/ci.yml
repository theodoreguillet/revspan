name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, types, tests, paquet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # .npmrc : ignore-scripts=true, aucun script d'installation n'est exécuté.
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run package:extension
      - uses: actions/upload-artifact@v7
        with:
          name: strata-vsix
          path: dist/strata.vsix
          if-no-files-found: error

  e2e:
    name: Tests UI (Playwright, faux Bitbucket)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: npm ci
      - run: npm run test:e2e
        env:
          PYTHON: python

  release:
    name: Release GitHub (tag v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Le tag correspond à la version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v8
        with:
          name: strata-vsix
          path: dist
      - name: Release avec le .vsix
        run: gh release create "$GITHUB_REF_NAME" dist/strata.vsix --title "Strata $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
